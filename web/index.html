<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LowCode Studio · 低代码平台</title>
    <style>
      /* 首屏骨架：JS 尚未执行时也能看到内容，避免「白屏 = 打不开」的错觉 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f7f9;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #667085;
        font-size: 13px;
      }
      .boot__logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #3b6ef6, #7b5bf0);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 15px;
      }
      .boot__bar {
        width: 160px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: #e4e7ec;
      }
      .boot__bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #3b6ef6;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      .boot__error {
        display: none;
        max-width: 560px;
        margin-top: 10px;
        padding: 16px 18px;
        background: #fff;
        border: 1px solid #fecdca;
        border-radius: 10px;
        color: #b42318;
        line-height: 1.9;
        font-size: 12.5px;
        text-align: left;
      }
      .boot__error b {
        color: #912018;
      }
      .boot__error code {
        background: #fef3f2;
        padding: 1px 5px;
        border-radius: 4px;
        font-family: Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot__logo">LC</div>
        <div>正在加载低代码平台…</div>
        <div class="boot__bar"></div>

        <!-- 启动失败兜底：正常情况下会被 Vue 挂载替换掉 -->
        <div class="boot__error" id="boot-fallback">
          <b>页面加载失败，可能是以下原因：</b><br />
          1. 后端服务未启动或已退出 —— 在项目根目录执行 <code>npm run dev</code>；<br />
          2. 端口被占用（后端 3001 / 前端 5173），终端会有 <code>EADDRINUSE</code> 提示；<br />
          3. 直接双击打开了 index.html —— 请通过 <code>http://localhost:5173</code> 或
          <code>http://localhost:3001</code> 访问；<br />
          4. 浏览器控制台（F12）有红色报错，请连同错误信息一起反馈。
        </div>
      </div>
    </div>
    <script>
      // 10 秒内 Vue 仍未挂载，说明资源加载或启动链路有问题：把具体排查方向展示出来
      window.__bootTimer = setTimeout(function () {
        var root = document.getElementById('app')
        var tip = document.getElementById('boot-fallback')
        if (root && root.getAttribute('data-mounted') !== '1' && tip) tip.style.display = 'block'
      }, 10000)
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
